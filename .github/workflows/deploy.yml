name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads the version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - uses: actions/configure-pages@v5
        with:
          enablement: true # create the Pages site if it does not exist yet

      # A site created as "deploy from a branch" also runs GitHub's own Jekyll build of the
      # repo root, which races this workflow and can publish the unbuilt source. Force the
      # source to "GitHub Actions" so only this workflow's dist/ artifact is ever published.
      - name: Ensure Pages deploys from this workflow only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages source: $source"
          if [ "$source" = "legacy" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow 2>/dev/null \
              && echo "Switched Pages source to GitHub Actions" \
              || echo "::warning::Pages source is 'Deploy from a branch', so GitHub's own branch build races this deploy and can publish the unbuilt source. A repo admin must set Settings → Pages → Source to 'GitHub Actions'."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
