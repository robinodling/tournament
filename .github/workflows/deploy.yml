name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # to see GitHub's own branch build for this commit

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads the version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - uses: actions/configure-pages@v5
        with:
          enablement: true # create the Pages site if it does not exist yet

      # A site created as "deploy from a branch" also runs GitHub's own Jekyll build of the
      # repo root, which races this workflow and can publish the unbuilt source. Force the
      # source to "GitHub Actions" so only this workflow's dist/ artifact is ever published.
      - name: Ensure Pages deploys from this workflow only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages source: $source"
          if [ "$source" = "legacy" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow 2>/dev/null \
              && echo "Switched Pages source to GitHub Actions" \
              || echo "::warning::Pages source is 'Deploy from a branch', so GitHub's own branch build races this deploy and can publish the unbuilt source. A repo admin must set Settings → Pages → Source to 'GitHub Actions'."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the Pages source is still "Deploy from a branch", GitHub also runs its own
      # build of the repo root for every push and whichever deploy lands last wins. Wait
      # for that run to finish so the built app is always the one that stays published.
      - name: Wait for any other deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            pending=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\"))] | length" 2>/dev/null || echo 0)
            if [ "$pending" = "0" ]; then echo "No other run in progress for this commit."; break; fi
            echo "Waiting for $pending other run(s) on this commit…"; sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@v4
